services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: classroom-only
      POSTGRES_DB: deliverydesk
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d deliverydesk"]
      interval: 5s
      timeout: 3s
      retries: 20
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama:/root/.ollama"]
  gateway:
    build: .
    profiles: ["ai"]
    environment:
      GATEWAY_KEY: ${GATEWAY_KEY:?Set GATEWAY_KEY in .env}
      GATEWAY_BIND: 0.0.0.0
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
    ports: ["127.0.0.1:4000:4000"]
    depends_on: [ollama]
volumes:
  pgdata:
  ollama:
